<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f4f1"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>Tennis Glicko</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout concept: a scoreboard-style ranking list on a quiet court-grey ground; one chart per player.
   Colour: ink on cool grey; the four court surfaces are the only chromatic colours (hard blue, clay orange, grass aqua, carpet violet). */
:root {
  --bg: #f1f4f1; --card: #ffffff; --ink: #14201d; --muted: #566561; --faint: #879591; --line: #dce3de;
  --chip: #e6ece7; --chip-on: #14201d; --chip-on-ink: #f1f4f1; --focus: #2a78d6;
  --s-g: #14201d; --s-h: #2a78d6; --s-c: #eb6834; --s-r: #1baf7a; --s-p: #6250d6;
  --up: #16794f; --down: #b3322f; --warn: #946200; --band: rgba(20,32,29,.10);
  --f-ui: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --card: #161e1b; --ink: #e8eeea; --muted: #9aa8a3; --faint: #6f7e79; --line: #26312d;
  --chip: #202b27; --chip-on: #e8eeea; --chip-on-ink: #0f1513; --focus: #6fa3e6;
  --s-g: #e8eeea; --s-h: #3987e5; --s-c: #d95926; --s-r: #199e70; --s-p: #9085e9;
  --up: #4cc38a; --down: #f0807d; --warn: #e0b04a; --band: rgba(232,238,234,.12); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1513; --card: #161e1b; --ink: #e8eeea; --muted: #9aa8a3; --faint: #6f7e79; --line: #26312d;
  --chip: #202b27; --chip-on: #e8eeea; --chip-on-ink: #0f1513; --focus: #6fa3e6;
  --s-g: #e8eeea; --s-h: #3987e5; --s-c: #d95926; --s-r: #199e70; --s-p: #9085e9;
  --up: #4cc38a; --down: #f0807d; --warn: #e0b04a; --band: rgba(232,238,234,.12); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-ui); -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
small, .muted { color: var(--muted); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 12px 0 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand { font: 700 24px/1 var(--f-num); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin: 0; }
.brand svg { flex: none; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 600; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.search { position: relative; }
.search input { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 40px; font-size: 16px; }
.search svg { position: absolute; left: 13px; top: 13px; color: var(--muted); }
.results { position: absolute; left: 0; right: 0; top: 50px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 62vh; overflow: auto; z-index: 25; }
.results button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 48px; }
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--chip); }
.results .n { font-weight: 600; }
.results .r { font: 600 18px/1 var(--f-num); text-align: right; }
.results .empty { padding: 14px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: 1px; }

.status { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 14px 0 0; }
.status .dot { margin-top: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--up); } .dot.warn { background: var(--warn); } .dot.load { background: var(--focus); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.load { animation: none; } }

.controls { display: grid; gap: 10px; margin: 14px 0 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; background: var(--chip); border-radius: 999px; padding: 0 14px; min-height: 36px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip i.gen, .tile .lb i.gen { background: transparent !important; box-shadow: inset 0 0 0 2.5px currentColor; }
.weekrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.weekrow input[type=range] { width: 100%; accent-color: var(--ink); min-width: 0; }
.iconbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-width: 40px; min-height: 40px; font-weight: 600; }
.weekmeta { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.weekmeta select { border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 8px; }
.weekmeta .wk { font-weight: 600; }
.nowbtn { border: 0; background: transparent; text-decoration: underline; padding: 6px; min-height: 36px; }

ol.list { list-style: none; margin: 8px 0 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 14px; min-height: 54px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
.row:last-child { border-bottom: 0; }
.row:hover, .row:focus-visible { background: var(--chip); }
.rk { font: 700 24px/1 var(--f-num); text-align: right; color: var(--muted); }
.row:nth-child(-n+3) .rk { color: var(--ink); }
.nm { min-width: 0; display: grid; gap: 4px; }
.nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm b small { font-weight: 500; margin-left: 6px; font-size: 12px; letter-spacing: .04em; }
.bar2 { height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.bar2 i { display: block; height: 100%; width: var(--w); background: var(--bar, var(--ink)); opacity: .75; }
.mv { font: 600 13px/1 var(--f-num); min-width: 30px; text-align: right; color: var(--muted); }
.mv.up { color: var(--up); } .mv.down { color: var(--down); }
.rt { text-align: right; font: 700 26px/1 var(--f-num); }
.rt small { display: block; font: 500 12px/1.2 var(--f-ui); }
.note { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.empty-state { padding: 28px 18px; text-align: center; color: var(--muted); }

.player { margin-top: 14px; display: grid; gap: 14px; }
.back { border: 0; background: transparent; padding: 8px 0; font-weight: 600; min-height: 40px; justify-self: start; }
.ph h2 { margin: 0; font: 700 34px/1.05 var(--f-num); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--muted); }
.pill { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.tile .lb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .lb i { width: 10px; height: 10px; border-radius: 3px; }
.tile .v { font: 700 34px/1 var(--f-num); }
.tile .v small { font: 500 13px/1 var(--f-ui); margin-left: 6px; }
.tile .s { font-size: 13px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px; }
.card h3 { margin: 0 0 8px; font: 600 16px/1.2 var(--f-ui); }
.chartbar { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 500 11px var(--f-ui); }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 13px; min-width: 150px; z-index: 5; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tip span.num { font-weight: 700; font-size: 16px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.facts .tile .v { font-size: 28px; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
details summary { cursor: pointer; padding: 10px 0; font-weight: 600; min-height: 44px; }
.tablewrap { overflow-x: auto; margin: 0 -6px 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; } th { color: var(--muted); font-weight: 500; }
.tabs { display: flex; gap: 2px; margin: 0 0 -10px; }
.tabs button { flex: 1; border: 0; border-bottom: 3px solid transparent; background: transparent; padding: 6px 4px; min-height: 42px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.sh { display: flex; align-items: baseline; gap: 10px; margin: 22px 2px 0; font: 700 22px/1.1 var(--f-num); letter-spacing: .04em; text-transform: uppercase; }
.sh small { font: 500 13px/1 var(--f-ui); letter-spacing: 0; text-transform: none; }
h3.day { margin: 16px 2px 6px; font: 600 13px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
ul.matches { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.m { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 5px; }
.m:last-child { border-bottom: 0; }
.mm { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.mm .t { font: 700 15px/1 var(--f-num); color: var(--ink); }
.sy { display: inline-flex; align-items: center; gap: 5px; }
.sy i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.live { font: 700 11px/1 var(--f-ui); letter-spacing: .08em; padding: 3px 6px; border-radius: 5px; background: var(--down); color: #fff; }
.mp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.pn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: transparent; padding: 3px 0; text-align: left; font-weight: 500; min-height: 28px; }
button.pn:hover { text-decoration: underline; }
.mp.fav .pn, .mp.won .pn { font-weight: 700; }
.pn small { font-weight: 500; margin-left: 4px; }
.pr { font: 700 20px/1 var(--f-num); text-align: right; white-space: nowrap; }
.mp:not(.fav) .pr { color: var(--muted); font-weight: 600; }
.tick { color: var(--up); font: 700 15px/1 var(--f-ui); margin-right: 8px; }
.pbar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ink); opacity: .75; }
.sc { font: 600 14px/1.2 var(--f-num); letter-spacing: .02em; color: var(--muted); }
.tag.up { background: transparent; box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); }
.pm .pt { font-weight: 500; }
.pm .pt .pn { display: inline; white-space: normal; padding: 0; font-weight: 600; }
.sc2 { font-size: 15px; color: var(--ink); }
.about { margin-top: 22px; display: grid; gap: 10px; }
.about p { margin: 6px 0; max-width: 65ch; }
.about ul { margin: 6px 0; padding-left: 20px; max-width: 65ch; }
.loading { padding: 40px 10px; text-align: center; color: var(--muted); }
.err { color: var(--down); }
@media (max-width: 420px) { .ph h2 { font-size: 30px; } .rt { font-size: 24px; } .brand { font-size: 21px; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="bar">
      <h1 class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 8.5c5 1 9 5 9.5 14M22.5 17.5c-5-1-9.5-5-10-14" fill="none" stroke="currentColor" stroke-width="2"/></svg>Tennis Glicko</h1>
      <div class="seg" role="group" aria-label="Tour"><button id="segM" type="button" aria-pressed="true">Men</button><button id="segW" type="button" aria-pressed="false">Women</button></div>
    </div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search any player, 1968 to today" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search players">
      <div id="results" class="results" hidden></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-tab="rank" aria-selected="true">Rankings</button>
      <button type="button" data-tab="week" aria-selected="false">This week</button>
      <button type="button" data-tab="past" aria-selected="false">Past results</button>
    </nav>
  </header>

  <main id="main"><div class="loading">Loading ratings…</div></main>

  <section class="about" id="about"></section>
</div>

<script>
/* Tennis Glicko-2 engine: identical maths to build_ratings.py (weekly periods, 5 systems).
   systems: 0 general, 1 hard, 2 clay, 3 grass, 4 carpet.  Works in the browser and in Node. */
(function (root) {
  'use strict';
  var Q = 173.7178, SIG0 = 0.06, NSYS = 5, TAU = 0.9, STRETCH = 2.0, PHI0 = 350 / Q;

  function gfun(phi) { return 1 / Math.sqrt(1 + 3 * phi * phi / (Math.PI * Math.PI)); }

  function newVol(phi, sigma, v, delta, tau) {
    var a = Math.log(sigma * sigma), d2 = delta * delta, p2 = phi * phi, t2 = tau * tau;
    function f(x) {
      var ex = Math.exp(x);
      return ex * (d2 - p2 - v - ex) / (2 * Math.pow(p2 + v + ex, 2)) - (x - a) / t2;
    }
    var A = a, B;
    if (d2 > p2 + v) B = Math.log(d2 - p2 - v);
    else {
      var k = 1;
      while (f(a - k * tau) < 0) { k++; if (k > 50) break; }
      B = a - k * tau;
    }
    var fA = f(A), fB = f(B), it = 0;
    while (Math.abs(B - A) > 1e-6 && it < 60) {
      var C = A + (A - B) * fA / (fB - fA), fC = f(C);
      if (fC * fB <= 0) { A = B; fA = fB; } else { fA /= 2; }
      B = C; fB = fC; it++;
    }
    return Math.exp(B / 2);
  }

  /* score for the winner from per-set game counts. ret=true -> plain win. */
  function scoreFromGames(gw, gl, ret) {
    if (ret || gw + gl <= 0) return 1;
    var share = gw / (gw + gl);
    return Math.min(1, Math.max(0, 0.5 + STRETCH * (share - 0.5)));
  }

  function Model(n) {
    this.n = 0;
    this.cap = 0;
    this.mu = []; this.phi = []; this.sig = []; this.last = [];
    for (var k = 0; k < NSYS; k++) { this.mu.push(null); this.phi.push(null); this.sig.push(null); this.last.push(null); }
    this.grow(n || 0);
    this.onUpdate = null;      // function(k, p, t, mu, phi)
  }
  Model.prototype.grow = function (n) {
    if (n <= this.n) return;
    if (n > this.cap) {
      var cap = Math.max(n, Math.ceil(this.cap * 1.5), 1024);
      for (var k = 0; k < NSYS; k++) {
        var m = new Float64Array(cap), p = new Float64Array(cap).fill(PHI0), s = new Float64Array(cap).fill(SIG0), l = new Int32Array(cap).fill(-1);
        if (this.mu[k]) { m.set(this.mu[k].subarray(0, this.n)); p.set(this.phi[k].subarray(0, this.n)); s.set(this.sig[k].subarray(0, this.n)); l.set(this.last[k].subarray(0, this.n)); }
        this.mu[k] = m; this.phi[k] = p; this.sig[k] = s; this.last[k] = l;
      }
      this.cap = cap;
    }
    this.n = n;
  };
  Model.prototype.clone = function () {
    var c = new Model(0);
    c.cap = this.cap; c.n = this.n; c.onUpdate = null;
    for (var k = 0; k < NSYS; k++) {
      c.mu[k] = this.mu[k].slice(); c.phi[k] = this.phi[k].slice(); c.sig[k] = this.sig[k].slice(); c.last[k] = this.last[k].slice();
    }
    return c;
  };
  /* state file: header uint32 count, uint32 liveStart, int32 idx[count], float32 [count][5][4] (mu,phi,sig,last) */
  Model.prototype.loadState = function (buf) {
    var dv = new DataView(buf), count = dv.getUint32(0, true), liveStart = dv.getUint32(4, true);
    var idx = new Int32Array(buf.slice(8, 8 + 4 * count));
    var f = new Float32Array(buf.slice(8 + 4 * count, 8 + 4 * count + 4 * count * NSYS * 4));
    var maxI = 0; for (var i = 0; i < count; i++) if (idx[i] > maxI) maxI = idx[i];
    this.grow(maxI + 1);
    for (var j = 0; j < count; j++) {
      var p = idx[j];
      for (var k = 0; k < NSYS; k++) {
        var o = (j * NSYS + k) * 4;
        this.mu[k][p] = f[o]; this.phi[k][p] = f[o + 1]; this.sig[k][p] = f[o + 2]; this.last[k][p] = Math.round(f[o + 3]);
      }
    }
    return liveStart;
  };
  Model.prototype.cur = function (k, p, t, out) {
    var last = this.last[k][p];
    if (last < 0) { out[0] = 0; out[1] = PHI0; out[2] = SIG0; return; }
    var phi = this.phi[k][p], gap = t - last - 1, sg = this.sig[k][p];
    if (gap > 0) phi = Math.sqrt(phi * phi + gap * sg * sg);
    out[0] = this.mu[k][p]; out[1] = phi; out[2] = sg;
  };
  /* games: array of [winner, loser, sWinner] */
  Model.prototype.period = function (k, t, games) {
    var by = new Map(), i, g;
    for (i = 0; i < games.length; i++) {
      g = games[i];
      if (!by.has(g[0])) by.set(g[0], []);
      if (!by.has(g[1])) by.set(g[1], []);
      by.get(g[0]).push([g[1], g[2]]);
      by.get(g[1]).push([g[0], 1 - g[2]]);
    }
    var cur = new Map(), tmp = [0, 0, 0];
    by.forEach(function (_, p) { this.cur(k, p, t, tmp); cur.set(p, [tmp[0], tmp[1], tmp[2]]); }, this);
    var upd = [];
    by.forEach(function (lst, p) {
      var c = cur.get(p), mu = c[0], phi = c[1], sig = c[2], vinv = 0, dsum = 0;
      for (var q = 0; q < lst.length; q++) {
        var o = cur.get(lst[q][0]), gg = gfun(o[1]), E = 1 / (1 + Math.exp(-gg * (mu - o[0])));
        vinv += gg * gg * E * (1 - E);

    for (k = 0; k < ns; k++) { var t2 = offs[k][nw]; rt.push(new Uint16Array(buf.slice(p, p + 2 * t2))); p += 2 * t2; }
    for (k = 0; k < ns; k++) { var t3 = offs[k][nw]; rd.push(new Uint8Array(buf.slice(p, p + t3))); p += t3; }

  var playersP = {};
  function loadPlayers(sex) { return playersP[sex] || (playersP[sex] = getJSON(DATA + 'players_' + sex + '.json')); }

  function ensureSex(sex) {
    var d = D[sex];
    if (d && d.promise) return d.promise;
    d = D[sex] = { sex: sex, ready: false, histCache: {}, live: { espn: new Map(), status: 'idle', fetched: 0, at: null, ok: 0, fail: 0 }, res: null };
    d.promise = Promise.all([
      loadPlayers(sex), getB64(DATA + 'top_' + sex + '.gz.txt').then(gunzip).then(parseTop),
      getB64(DATA + 'state_' + sex + '.gz.txt').then(gunzip), getJSON(DATA + 'pending_' + sex + '.json')
    ]).then(function (r) {

      d.base = new G.Model(0); d.liveStart = d.base.loadState(r[2]);

  /* ---------------- live results (ESPN) ---------------- */
  function cacheRead(d) {
    for (var t = d.liveStart; t <= NOW_WEEK; t++) {
      var c = lsGet('tg6:' + d.sex + ':' + t);
      if (c && c.ms) c.ms.forEach(function (m) { d.live.espn.set(m.key, m); });
    }
    var w = lsGet('tg6w:' + d.sex);                       // last known schedule and results of this week
    if (w && w.ms) d.wk = { at: new Date(w.ts), ms: w.ms, cached: true };
  }
  function shortRound(r) {
    var m;
    r = String(r || '');
    if ((m = /qualifying\s+(\d)/i.exec(r))) return 'Q' + m[1];
    if (/qualifying/i.test(r)) return 'Q';
    if ((m = /round of (\d+)/i.exec(r))) return 'R' + m[1];
    if ((m = /^round (\d+)$/i.exec(r))) return 'R' + m[1];
    if ((m = /(\d)(?:st|nd|rd|th) round/i.exec(r))) return 'R' + m[1];

  }
  function rerun(d) {

      { snapshots: true, cuts: cuts, topn: 100, activeWeeks: META.params.activeWeeks });

  }
  function pool(items, n, fn) {
    var i = 0, active = 0;
    return new Promise(function (resolve) {
      function next() {
        if (i >= items.length && active === 0) return resolve();
        while (active < n && i < items.length) {
          (function (it) { active++; Promise.resolve(fn(it)).catch(function () {}).then(function () { active--; next(); }); })(items[i++]);
        }
      }
      next();
    });
  }
  function refreshLive(d, force) {
    var league = d.sex === 'M' ? 'atp' : 'wta', weeks = [], t;
    for (t = d.liveStart; t <= NOW_WEEK + 1; t++) weeks.push(t);          // + next week, for the schedule
    d.live.status = 'loading'; d.live.ok = 0; d.live.fail = 0; paintStatus();
    var now = Date.now(), raw = {};
    return pool(weeks, 4, function (t) {
      var key = 'tg6:' + d.sex + ':' + t, c = t <= NOW_WEEK ? lsGet(key) : null;
      var weekEnd = ((t * 7 + 8) - 719163) * 86400000 + 2 * 86400000;       // two days after the week ends
      if (c && c.ts > weekEnd && !force) { d.live.ok++; return; }
      var date = C.isoOf(t * 7 + 3).replace(/-/g, '');
      return fetch('https://site.api.espn.com/apis/site/v2/sports/tennis/' + league + '/scoreboard?dates=' + date)
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(function (j) {
          var all = C.parseMatches(j, d.sex, GUESS);
          if (t >= NOW_WEEK) raw[t] = all;
          if (t > NOW_WEEK) { d.live.ok++; return; }
          var ms = all.filter(function (m) { return m.state === 'final' || m.state === 'ret'; }).map(function (m) {
            return { key: m.key, week: m.week, date: m.date, sy: m.sy, s: m.s, w: m.p[m.win], l: m.p[1 - m.win], ev: m.event, rd: shortRound(m.round), sc: m.text };
          });
          ms.forEach(function (m) { d.live.espn.set(m.key, m); });
          lsSet(key, { ts: now, ms: ms }); d.live.ok++;
        })
        .catch(function () { d.live.fail++; });
    }).then(function () {
      var seen = new Set(), wk = [];
      [NOW_WEEK, NOW_WEEK + 1].forEach(function (t) {
        (raw[t] || []).forEach(function (m) {
          if (seen.has(m.key)) return; seen.add(m.key);
          wk.push({ key: m.key, ev: m.event, city: m.city, wk: m.week, sy: m.sy, how: m.how, rd: shortRound(m.round), start: m.start, date: m.date, court: m.court, st: m.state, p: m.p, win: m.win, sc: m.text });

  }

  /* ---------------- data access ---------------- */
  function latestWeek(d) { return NOW_WEEK; }
  function getList(d, t, sys) {
    if (t >= d.liveStart) {
      var w = d.liveWeeks[t - d.liveStart]; if (!w) return { idx: [], rt: [], rd: [] };
      return w.top[sys];
    }
    var T = d.top, i = t - T.w0;
    if (i < 0 || i >= T.nw) return { idx: [], rt: [], rd: [] };
    var a = T.offs[sys][i], b = T.offs[sys][i + 1], out = { idx: [], rt: [], rd: [] };
    for (var j = a; j < b; j++) { out.idx.push(T.idx[sys][j]); out.rt.push(T.rt[sys][j]); out.rd.push(T.rd[sys][j]); }
    return out;
  }
  function playerName(d, i) { return d.players.n[i] || 'Unknown'; }
  function info(d, i) {
    var m = d.res.model, t = NOW_WEEK, out = { sys: [] }, k;
    for (k = 0; k < 5; k++) {
      if (i >= m.n || m.last[k][i] < 0) { out.sys.push(null); continue; }
      var rd = m.rd(k, i, t), cut = META.params.rdCut[k];
      out.sys.push({ r: m.rating(k, i), rd: rd, last: m.last[k][i], prov: rd > cut });
    }
    out.active = i < m.n && m.last[0][i] >= t - (META.params.activeWeeks - 1);
    return out;
  }
  function rankNow(d, i, k) {
    var m = d.res.model, t = NOW_WEEK, cut = META.params.rdCut[k], aw = META.params.activeWeeks;
    if (i >= m.n || m.last[k][i] < 0 || m.last[0][i] < t - (aw - 1) || m.rd(k, i, t) > cut) return null;
    var r = m.rating(k, i), c = 1;
    for (var p = 0; p < m.n; p++) {
      if (p !== i && m.last[0][p] >= t - (aw - 1) && m.last[k][p] >= 0 && m.rating(k, p) > r && m.rd(k, p, t) <= cut) c++;

  }
  /* decoded history for one player: {g:[{t,r,rd}...], h:..., c:..., r:..., p:...} */
  function loadHist(d, i) {

    if (!c) c = d.histCache[shard] = getJSON(DATA + 'hist_' + d.sex + '_' + shard + '.json');
    return c.then(function (list) {
      var e = null; for (var j = 0; j < list.length; j++) if (list[j].i === i) { e = list[j]; break; }
      var out = {};
      SKEY.forEach(function (key, k) {
        var pts = [];
        if (e && e[key]) { var w = 0, a = e[key]; for (var q = 0; q < a[0].length; q++) { w += a[0][q]; pts.push({ t: w, r: a[1][q], rd: a[2][q] }); } }

  /* ---------------- search ---------------- */
  var searchIdx = { M: null, W: null };
  function buildSearch(sex) {
    var d = D[sex], pl = d ? d.players : null;
    if (!pl) return null;
    var si = searchIdx[sex];
    if (si && si.n === pl.n.length) return si;
    var norm = pl.n.map(function (x) { return ' ' + C.norm(x); });
    si = searchIdx[sex] = { n: pl.n.length, norm: norm };
    return si;
  }
  function search(q) {
    var toks = C.norm(q).split(' ').filter(Boolean), out = [];
    if (!toks.length) return out;
    ['M', 'W'].forEach(function (sex) {
      var d = D[sex], si = buildSearch(sex);
      if (!si) return;
      for (var i = 0; i < si.norm.length; i++) {
        var s = si.norm[i], ok = true, starts = 0;
        for (var k = 0; k < toks.length; k++) {
          if (s.indexOf(' ' + toks[k]) >= 0) starts++;
          else if (s.indexOf(toks[k]) < 0) { ok = false; break; }
        }
        if (ok) out.push({ sex: sex, i: i, score: starts * 10000 + (d.players.pk[i] || 0) });
      }
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, 15);
  }
  function renderResults() {
    var box = $('#results'), q = $('#q').value.trim();

      box.hidden = false; box.innerHTML = '<div class="empty">Loading player lists…</div>'; return;
    }
    box.hidden = false;

    box.innerHTML = res.map(function (r) {
      var d = D[r.sex], pl = d.players, f = pl.f[r.i], l = pl.l[r.i], inf = info(d, r.i), g = inf.sys[0];
      var yrs = f >= 0 ? yearOfWeek(f) + '–' + (inf.active ? 'now' : yearOfWeek(Math.max(l, f))) : 'new';
      return '<button type="button" data-sex="' + r.sex + '" data-i="' + r.i + '"><span class="n">' + esc(playerName(d, r.i)) +
        '<span class="tag">' + (r.sex === 'M' ? 'ATP' : 'WTA') + '</span> <small>' + esc(pl.c[r.i] || '') + ' · ' + yrs + '</small></span>' +
        '<span class="r">' + (g ? Math.round(g.r) : (pl.r[r.i] || '–')) + '</span></button>';

  /* ---------------- rankings view ---------------- */
  function seg() {
    $('#segM').setAttribute('aria-pressed', S.sex === 'M'); $('#segW').setAttribute('aria-pressed', S.sex === 'W');
  }
  function yearOptions(d, t) {
    var y0 = yearOfWeek(d.top.w0), y1 = yearOfWeek(NOW_WEEK), cur = yearOfWeek(t), s = '';

  function renderRank() {

      '<p class="note">' + SYS[S.sys] + ' rating, ' + (S.sex === 'M' ? 'men' : 'women') + '. Only players who played in the last 52 weeks and whose uncertainty (±RD) is at most ' + cut + ' are ranked; the rest are provisional and still searchable.</p>';

  function paintStatus() {

      else if (d.wk && !d.wk.cached) { cls = 'ok'; txt = 'Schedule and results updated ' + d.wk.at.toLocaleTimeString([], tf) + ' · refreshes every 2 hours'; }
      else if (d.wk) txt = 'Live feed not reachable · showing the last saved copy from ' + d.wk.at.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });

  /* ---------------- player view ---------------- */
  var chartState = { range: 'all', on: { g: true, h: false, c: false, r: false, p: false } };

    else if (rkG) status = '<span class="pill"><span class="dot ok"></span>Ranked #' + rkG + ' in the ' + (S.sex === 'M' ? 'men’s' : 'women’s') + ' list</span>';

  function rankFacts(d, i) {
    var w1 = 0, w10 = 0, w100 = 0, best = 1e9, t, j, L;
    for (t = d.top.w0; t <= NOW_WEEK; t++) {

    }

  }

  function drawPlayer(d, i, h) {
    var pl = d.players, rf = rankFacts(d, i), hasP = h.p.length > 0;
    paintHeader(d, i, h);
    var cuts = META.params.rdCut;

  function niceStep(span, target) {

  /* ---------------- about ---------------- */

      '<p>Every player has a Glicko-2 rating, updated once a week using all of that week’s matches. A new player starts at 1500 with an uncertainty (RD) of 350 points; the rating moves most while RD is large and settles as results accumulate.</p>' +

    var cur = S.view === 'player' ? 'rank' : S.view;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs [data-tab]'), function (b) { b.setAttribute('aria-selected', b.dataset.tab === cur); });
  }
  function render() {
    seg(); tabs();
    if (S.view === 'player') renderPlayer();
    else if (S.view === 'week') renderWeek();
    else if (S.view === 'past') renderPast();
    else renderRank();
  }
  function route() {
    var h = location.hash.replace(/^#/, ''), m = /^p-([MW])-(\d+)$/.exec(h);
    S.more = 0;
    if (m) {
      S.view = 'player'; S.sex = m[1]; S.pid = +m[2];
      ensureSex(S.sex).then(render); render(); window.scrollTo(0, 0);
    } else {
      S.view = h === 'week' || h === 'past' ? h : 'rank';
      ensureSex(S.sex).then(function () { render(); }); render();
      if (S.view !== 'rank') window.scrollTo(0, 0);
    }
  }
  function go(hash) { if (location.hash === '#' + hash) route(); else location.hash = hash; }
  function setSex(sex) {
    if (S.sex === sex && S.view !== 'player') return;
    S.sex = sex; S.week = null; S.pweek = null; S.more = 0;
    if (S.view === 'player') { S.view = 'rank'; if (location.hash && location.hash !== '#rank') location.hash = 'rank'; else route(); }
    else { ensureSex(sex).then(render); render(); }
  }
  function stepWeek(dlt) {
    var d = D[S.sex], t = (S.week == null ? NOW_WEEK : S.week) + dlt;
    S.week = Math.max(d.top.w0, Math.min(NOW_WEEK, t)); if (S.week >= NOW_WEEK) S.week = null; renderRank();
  }
  function bind() {
    $('#segM').addEventListener('click', function () { setSex('M'); });
    $('#segW').addEventListener('click', function () { setSex('W'); });
    $('#q').addEventListener('input', function () { ensureSex('M'); ensureSex('W'); renderResults(); Promise.all([ensureSex('M'), ensureSex('W')]).then(renderResults); });
    $('#q').addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('#q').value = ''; renderResults(); } });
    document.addEventListener('click', function (e) {
      var t = e.target, b;
      if ((b = t.closest('#results button'))) { $('#q').value = ''; $('#results').hidden = true; S.sex = b.dataset.sex; go('p-' + b.dataset.sex + '-' + b.dataset.i); return; }
      if (!t.closest('.search')) $('#results').hidden = true;
      if ((b = t.closest('.row'))) { go('p-' + S.sex + '-' + b.dataset.i); return; }
      if ((b = t.closest('[data-pl]'))) { go('p-' + S.sex + '-' + b.dataset.pl); return; }
      if ((b = t.closest('#tabs [data-tab]'))) { go(b.dataset.tab); return; }
      if (t.closest('#moreUp')) { S.more = 1; render(); return; }
      if ((b = t.closest('[data-tier]'))) { S.tier = +b.dataset.tier; S.more = 0; renderPast(); return; }
      if (t.closest('#pwPrev') || t.closest('#pwNext')) {
        var dd = D[S.sex], cw = S.pweek == null ? NOW_WEEK : S.pweek, nw = cw + (t.closest('#pwNext') ? 1 : -1);
        S.pweek = Math.max(dd.liveStart, Math.min(NOW_WEEK, nw)); S.more = 0; renderPast(); return;
      }
      if ((b = t.closest('[data-sys]'))) { S.sys = +b.dataset.sys; renderRank(); return; }
      if ((b = t.closest('[data-n]'))) { S.topn = +b.dataset.n; renderRank(); return; }
      if (t.closest('#wkPrev')) return stepWeek(-1);
      if (t.closest('#wkNext')) return stepWeek(1);
      if (t.closest('#nowBtn')) { S.week = null; return renderRank(); }
      if (t.closest('#back')) { if (history.length > 1 && location.hash.indexOf('p-') === 1) history.back(); else go('rank'); return; }
      if ((b = t.closest('[data-ser]'))) { chartState.on[b.dataset.ser] = !chartState.on[b.dataset.ser]; if (S.hist) { drawPlayer(D[S.sex], S.pid, S.hist); } return; }
      if ((b = t.closest('[data-range]'))) { chartState.range = b.dataset.range; if (S.hist) drawPlayer(D[S.sex], S.pid, S.hist); return; }
    });
    document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('row')) { e.preventDefault(); e.target.click(); } });
    document.addEventListener('input', function (e) { if (e.target.id === 'wk') { var t = +e.target.value; S.week = t >= NOW_WEEK ? null : t; renderRank(); var w = $('#wk'); if (w) w.focus(); } });
    document.addEventListener('change', function (e) {
      if (e.target.id === 'pwSel') { S.pweek = +e.target.value; S.more = 0; renderPast(); return; }
      if (e.target.id === 'yr') { var d = D[S.sex], t = Math.max(d.top.w0, Math.floor(C.ordOf(e.target.value + '-01-01') / 7) + 1); S.week = t >= NOW_WEEK ? null : t; renderRank(); }
    });
    window.addEventListener('hashchange', route);
    var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (S.view === 'player' && S.hist) paintChart(S.hist); }, 120); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') ['M', 'W'].forEach(function (s) { var d = D[s]; if (d && d.ready && (!d.live.at || Date.now() - d.live.at.getTime() > REFRESH_MS)) refreshLive(d); });
    });
    setInterval(function () { ['M', 'W'].forEach(function (s) { var d = D[s]; if (d && d.ready) refreshLive(d); }); }, REFRESH_MS);
  }

  function start() {
    Promise.all([getJSON(DATA + 'meta.json'), getJSON(DATA + 'tsurf.json'), getJSON(DATA + 'winprob.json')]).then(function (r) {
      META = r[0]; TS = r[1]; COEF = r[2]; GUESS = new C.SurfaceGuesser(TS);
      renderAbout(); bind(); route();
      var first = S.sex;
      ensureSex(first).then(function (d) { render(); refreshLive(d); return ensureSex(first === 'M' ? 'W' : 'M'); }).then(function (d2) { return refreshLive(d2); });
    }).catch(function (e) { $('#main').innerHTML = '<div class="loading err">Could not load the rating data (' + esc(e.message) + ').</div>'; });
  }
  start();
})();

</script>

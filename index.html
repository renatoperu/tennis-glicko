.fl { font-family: "TwemojiFlags", sans-serif; font-style: normal; font-weight: 400; margin-right: .3em; letter-spacing: 0; }
.rtour { border-top: 1px solid var(--line); padding: 10px 0; } .rtour:first-of-type { border-top: 0; }
.rth { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 12px; align-items: baseline; }
.rdate { font: 600 13px/1.2 var(--f-ui); color: var(--muted); white-space: nowrap; } .rname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; } .rdel { text-align: right; font-size: 18px; white-space: nowrap; }
.rl { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; } .rl li { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; min-width: 0; }
.rr { display: inline-block; min-width: 34px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.wl { display: inline-block; width: 1.2em; text-align: center; } .wl.w { color: var(--up); } .wl.l { color: var(--down); }
@media (max-width: 520px) { .rth { grid-template-columns: minmax(0,1fr) auto; } .rdate { grid-column: 1 / -1; } }
.cty { border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 8px; max-width: 100%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --card: #161e1b; --ink: #e8eeea; --muted: #9aa8a3; --faint: #6f7e79; --line: #26312d;
  --chip: #202b27; --chip-on: #e8eeea; --chip-on-ink: #0f1513; --focus: #6fa3e6;
  --s-g: #e8eeea; --s-h: #3987e5; --s-c: #d95926; --s-r: #199e70; --s-p: #9085e9;
  --up: #4cc38a; --down: #f0807d; --warn: #e0b04a; --band: rgba(232,238,234,.12); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1513; --card: #161e1b; --ink: #e8eeea; --muted: #9aa8a3; --faint: #6f7e79; --line: #26312d;
  --chip: #202b27; --chip-on: #e8eeea; --chip-on-ink: #0f1513; --focus: #6fa3e6;
  --s-g: #e8eeea; --s-h: #3987e5; --s-c: #d95926; --s-r: #199e70; --s-p: #9085e9;
  --up: #4cc38a; --down: #f0807d; --warn: #e0b04a; --band: rgba(232,238,234,.12); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-ui); -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
small, .muted { color: var(--muted); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 12px 0 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand { font: 700 24px/1 var(--f-num); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin: 0; }
.brand svg { flex: none; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 600; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.search { position: relative; }
.search input { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 40px; font-size: 16px; }
.search svg { position: absolute; left: 13px; top: 13px; color: var(--muted); }
.results { position: absolute; left: 0; right: 0; top: 50px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 62vh; overflow: auto; z-index: 25; }
.results button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 48px; }
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--chip); }
.results .n { font-weight: 600; }
.results .r { font: 600 18px/1 var(--f-num); text-align: right; }
.results .empty { padding: 14px; color: var(--muted); }

  function niceStep(span, target) {
    var raw = span / target, steps = [10, 20, 25, 50, 100, 200, 250, 500];
    for (var i = 0; i < steps.length; i++) if (steps[i] >= raw) return steps[i];
    return 500;
  }
  function paintChart(h) {
    var el = $('#chart'); if (!el) return;
    var W = Math.max(280, el.clientWidth || 640), H = W < 500 ? 280 : 330, m = { l: 40, r: 10, t: 10, b: 24 };
    var keys = SKEY.filter(function (k) { return chartState.on[k] && h[k].length; });
    if (!keys.length) { chartState.on.g = true; keys = ['g']; }
    var all = h.g.length ? h.g : h[keys[0]];
    // the chart ends where the career ends: a player who has not played for a year stops at his last week, everyone else runs to today
    var lastT = 0; SKEY.forEach(function (k) { if (h[k].length) lastT = Math.max(lastT, h[k][h[k].length - 1].t); });
    var tMax = lastT && NOW_WEEK - lastT > 52 ? lastT : Math.max(NOW_WEEK, lastT), tMin = all.length ? all[0].t : tMax - 52;
    if (chartState.range !== 'all') tMin = Math.max(tMin, tMax - Math.round(+chartState.range * 52.18));
    if (tMax - tMin < 8) tMin = tMax - 8;
    var lo = Infinity, hi = -Infinity;
    keys.forEach(function (k) { h[k].forEach(function (x) { if (x.t >= tMin) { var b = k === 'g' ? x.rd : 0; lo = Math.min(lo, x.r - b); hi = Math.max(hi, x.r + b); } }); });
    if (!isFinite(lo)) { lo = 1400; hi = 1700; }
    var step = niceStep(hi - lo, 5);
    var y0 = Math.floor((lo - 5) / step) * step, y1 = Math.ceil((hi + 5) / step) * step;
    function X(t) { return m.l + (t - tMin) / (tMax - tMin) * (W - m.l - m.r); }
    function Y(v) { return H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b); }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Rating evolution chart">';
    for (var v = y0; v <= y1; v += step) svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (m.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    var y0y = yearOfWeek(tMin), y1y = yearOfWeek(tMax), ys = Math.max(1, Math.ceil((y1y - y0y) / 7));

      h.g.forEach(function (x) { if (x.t < tMin) return; up += (up ? 'L' : 'M') + X(x.t).toFixed(1) + ' ' + Y(x.r + x.rd).toFixed(1); dn.unshift('L' + X(x.t).toFixed(1) + ' ' + Y(x.r - x.rd).toFixed(1)); });
      if (up) svg += '<path d="' + up + dn.join('') + 'Z" fill="var(--band)" stroke="none"/>';
    }
    keys.forEach(function (k, ki) {
      var d2 = '', col = 'var(' + SVAR[SKEY.indexOf(k)] + ')';
      h[k].forEach(function (x) { if (x.t < tMin) return; d2 += (d2 ? 'L' : 'M') + X(x.t).toFixed(1) + ' ' + Y(x.r).toFixed(1); });
      if (d2) svg += '<path d="' + d2 + '" fill="none" stroke="' + col + '" stroke-width="' + (k === 'g' ? 2.4 : 1.8) + '" stroke-linejoin="round" stroke-linecap="round"' + (k === 'g' ? '' : ' stroke-dasharray="0"') + '/>';
    });
    // peak marker on general

      cmpRow('Weeks at #1', rfA.w1, rfB.w1) + cmpRow('Weeks in top 10', rfA.w10, rfB.w10) + cmpRow('Weeks in top 100', rfA.w100, rfB.w100) +
      cmpRow('First rated', d.players.f[a] >= 0 ? yearOfWeek(d.players.f[a]) : '–', d.players.f[b] >= 0 ? yearOfWeek(d.players.f[b]) : '–') +
      '</tbody></table></div></div>';
    var bar = '<div class="chips" role="group" aria-label="Rating">';
    SKEY.forEach(function (key, k) { if (k === 4 && !(ha.p.length || hb.p.length)) return; bar += '<button type="button" class="chip" data-csys="' + key + '" aria-pressed="' + (cmpState.sys === key) + '"><i' + (k === 0 ? ' class="gen"' : '') + ' style="background:var(' + SVAR[k] + ')"></i>' + SYS[k] + '</button>'; });
    bar += '</div><div class="chips" role="group" aria-label="Horizontal axis">';
    [['year', 'Calendar year'], ['age', 'Player age']].forEach(function (r) { bar += '<button type="button" class="chip" data-caxis="' + r[0] + '" aria-pressed="' + (cmpState.axis === r[0]) + '">' + r[1] + '</button>'; });
    if (cmpState.axis === 'age') {
      bar += '</div><div class="chips" role="group" aria-label="Up to age">';
      [['all', 'All ages'], ['35', 'To 35'], ['30', 'To 30'], ['25', 'To 25']].forEach(function (r) { bar += '<button type="button" class="chip" data-ccap="' + r[0] + '" aria-pressed="' + (cmpState.cap === r[0]) + '">' + r[1] + '</button>'; });
    } else {
      bar += '</div><div class="chips" role="group" aria-label="Range">';
      [['all', 'All'], ['20', '20y'], ['10', '10y'], ['5', '5y'], ['2', '2y']].forEach(function (r) { bar += '<button type="button" class="chip" data-crange="' + r[0] + '" aria-pressed="' + (cmpState.range === r[0]) + '">' + r[1] + '</button>'; });
    }
    var chart = '<div class="card"><h3>Rating evolution</h3><div class="chartbar">' + bar + '</div></div><div id="cchart" class="chart"></div>' +
      '<div class="legend2"><span><i class="sw" style="background:var(' + CMPVAR[0] + ')"></i>' + esc(playerName(d, a)) + '</span><span><i class="sw" style="background:var(' + CMPVAR[1] + ')"></i>' + esc(playerName(d, b)) + '</span></div></div>';
    var ageOpts = ''; for (var ag = 16; ag <= 42; ag++) ageOpts += '<option value="' + ag + '"' + (ag === cmpState.age ? ' selected' : '') + '>' + ag + '</option>';
    var arows = '';
    for (var kk = 0; kk < 5; kk++) {
      if (kk === 4 && !(ha.p.length || hb.p.length)) continue;
      var xa = ratingAtAge(d, a, ha, SKEY[kk], cmpState.age), xb = ratingAtAge(d, b, hb, SKEY[kk], cmpState.age);
      if (!xa && !xb) continue;
      var cl = function (z, o) { return z ? '<b' + (o && z.r > o.r ? ' class="lead"' : '') + '>' + Math.round(z.r) + '</b> <small>±' + Math.round(z.rd) + '</small>' : '–'; };
      arows += '<tr><th scope="row"><i class="sw' + (kk === 0 ? ' gen' : '') + '" style="background:var(' + SVAR[kk] + ')"></i>' + SYS[kk] + '</th><td>' + cl(xa, xb) + '</td><td>' + cl(xb, xa) + '</td></tr>';
    }
    var noDob = [a, b].filter(function (i) { return !(d.players.b && d.players.b[i]); });
    var atAge = '<div class="card"><h3>Rating at age <select id="cage" class="cty" aria-label="Age">' + ageOpts + '</select></h3>' +
      (arows ? '<div class="tablewrap"><table class="cmptbl"><thead><tr><th></th><th>' + esc(playerName(d, a)) + '</th><th>' + esc(playerName(d, b)) + '</th></tr></thead><tbody>' + arows + '</tbody></table></div>' : '') +
      '<p class="note">' + (noDob.length ? 'No birth date on record for ' + esc(noDob.map(function (i) { return playerName(d, i); }).join(' and ')) + '. ' : '') + 'Rating the player had when reaching that age; a dash means the player was not yet rated at that age, or had already stopped playing. Bold marks the higher rating.</p></div>';
    $('#cmpbody').innerHTML = head + tbl + chart + atAge + facts;
    S.cmpH = [ha, hb];
    paintCompare(d, a, b, ha, hb);
  }
  function paintCompare(d, a, b, ha, hb) {
    var el = $('#cchart'); if (!el) return;
    var key = cmpState.sys, ids = [a, b], inf = [info(d, a), info(d, b)], AGE = cmpState.axis === 'age';
    var dob = ids.map(function (i) { return d.players.b ? d.players.b[i] : 0; });
    function xOf(n, t) { return AGE ? (C.mondayOfWeek(t) - (693596 + dob[n])) / 365.25 : t; }
    var ser = [ha[key] || [], hb[key] || []].map(function (s, n) {
      if (AGE && !dob[n]) return [];
      return s.map(function (x) { return { t: x.t, r: x.r, rd: x.rd, x: xOf(n, x.t) }; });
    });
    var endX = ser.map(function (s, n) { return s.length ? xOf(n, inf[n].active ? Math.max(NOW_WEEK, s[s.length - 1].t) : s[s.length - 1].t) : -Infinity; });
    var W = Math.max(280, el.clientWidth || 640), H = W < 500 ? 280 : 330, mg = { l: 40, r: 10, t: 10, b: 24 };
    var miss = AGE ? ids.map(function (i, n) { return dob[n] ? '' : playerName(d, i); }).filter(Boolean) : [];
    var note = miss.length ? '<p class="note" style="padding:8px 14px 0">No birth date on record for ' + esc(miss.join(' and ')) + ', so ' + (miss.length > 1 ? 'they cannot' : 'this player cannot') + ' be shown by age.</p>' : '';
    if (!ser[0].length && !ser[1].length) { el.innerHTML = note + '<p class="note" style="padding:14px">' + (miss.length ? '' : 'Neither player has a rating on this surface.') + '</p>'; return; }
    var tMin = Infinity, tMax = -Infinity;
    ser.forEach(function (s, n) { if (!s.length) return; tMin = Math.min(tMin, s[0].x); tMax = Math.max(tMax, endX[n]); });
    if (AGE) {
      if (cmpState.cap !== 'all') tMax = Math.min(tMax, +cmpState.cap);
      tMin = Math.floor(tMin);
      if (tMax - tMin < 2) tMax = tMin + 2;
    } else {
      if (cmpState.range !== 'all') tMin = Math.max(tMin, tMax - Math.round(+cmpState.range * 52.18));
      if (tMax - tMin < 8) tMin = tMax - 8;
    }
    var lo = Infinity, hi = -Infinity;
    ser.forEach(function (s) { s.forEach(function (x) { if (x.x >= tMin && x.x <= tMax) { lo = Math.min(lo, x.r); hi = Math.max(hi, x.r); } }); });
    if (!isFinite(lo)) { lo = 1400; hi = 1700; }
    var step = niceStep(hi - lo, 5), y0 = Math.floor((lo - 5) / step) * step, y1 = Math.ceil((hi + 5) / step) * step;
    function X(t) { return mg.l + (t - tMin) / (tMax - tMin) * (W - mg.l - mg.r); }
    function Y(v) { return H - mg.b - (v - y0) / (y1 - y0) * (H - mg.t - mg.b); }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Rating comparison chart">';
    for (var v = y0; v <= y1; v += step) svg += '<line x1="' + mg.l + '" x2="' + (W - mg.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (mg.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    if (AGE) {
      var as = Math.max(1, Math.ceil((tMax - tMin) / 8));
      for (var g = Math.ceil(tMin / as) * as; g <= tMax; g += as) svg += '<text x="' + X(g) + '" y="' + (H - 6) + '" text-anchor="middle">' + g + '</text>';
    } else {
      var y0y = yearOfWeek(tMin), y1y = yearOfWeek(tMax), ys = Math.max(1, Math.ceil((y1y - y0y) / 7));
      for (var y = Math.ceil(y0y / ys) * ys; y <= y1y; y += ys) {
        var tw = Math.floor(C.ordOf(y + '-01-01') / 7); if (tw < tMin || tw > tMax) continue;
        svg += '<text x="' + X(tw) + '" y="' + (H - 6) + '" text-anchor="middle">' + y + '</text>';
      }
    }
    ser.forEach(function (s, n) {
      var p = '', lastv = null;
      s.forEach(function (x) { if (x.x >= tMin && x.x <= tMax) { p += (p ? 'L' : 'M') + X(x.x).toFixed(1) + ' ' + Y(x.r).toFixed(1); } });
      if (p) svg += '<path d="' + p + '" fill="none" stroke="var(' + CMPVAR[n] + ')" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    svg += '<line id="xh" x1="0" x2="0" y1="' + mg.t + '" y2="' + (H - mg.b) + '" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><g id="dots"></g><rect id="hit" x="' + mg.l + '" y="' + mg.t + '" width="' + (W - mg.l - mg.r) + '" height="' + (H - mg.t - mg.b) + '" fill="transparent"/></svg><div id="tip" class="tip" hidden></div>';
    el.innerHTML = note + svg;
    var hit = $('#hit', el), tip = $('#tip', el), xh = $('#xh', el), dots = $('#dots', el);
    function at(arr, t) { var l = 0, r = arr.length - 1, res = null; while (l <= r) { var mid = (l + r) >> 1; if (arr[mid].x <= t) { res = arr[mid]; l = mid + 1; } else r = mid - 1; } return res; }
    function move(ev) {
      var rect = el.getBoundingClientRect(), svgEl = $('svg', el), sr = svgEl.getBoundingClientRect(), px = (ev.clientX - sr.left) * (W / sr.width);
      var t = tMin + (px - mg.l) / (W - mg.l - mg.r) * (tMax - tMin);
      t = Math.max(tMin, Math.min(tMax, AGE ? Math.round(t * 20) / 20 : Math.round(t)));
      var rows = '', dd = '';
      ser.forEach(function (s, n) {
        var x = at(s, t); if (!x || t > endX[n]) return;
        var when = AGE ? ' <small class="muted">' + fmtWeek(Math.floor((693596 + dob[n] + t * 365.25) / 7)) + '</small>' : '';
        rows += '<div><span><i style="background:var(' + CMPVAR[n] + ')"></i>' + esc(playerName(d, ids[n])) + when + '</span><span class="num">' + Math.round(x.r) + ' <small>±' + Math.round(x.rd) + '</small></span></div>';
        dd += '<circle cx="' + X(t) + '" cy="' + Y(x.r) + '" r="4" fill="var(' + CMPVAR[n] + ')" stroke="var(--card)" stroke-width="2"/>';
      });
      xh.setAttribute('x1', X(t)); xh.setAttribute('x2', X(t)); xh.setAttribute('visibility', 'visible'); dots.innerHTML = dd;
      tip.hidden = false; tip.innerHTML = '<b>' + (AGE ? 'Age ' + t.toFixed(1) : 'Week of ' + fmtWeek(t)) + '</b>' + (rows || '<div><span>No rating yet</span></div>');
      var tx = X(t) / W * sr.width + 12; if (tx + 190 > sr.width) tx -= 210;
      tip.style.left = Math.max(0, tx) + 'px'; tip.style.top = '8px';
    }
    function leave() { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; }
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', leave);
  }
  /* rating of a player at exact age N (years): last weekly value on or before that age; null if not yet rated or career ended earlier */
  function ratingAtAge(d, i, h, key, N) {
    var b = d.players.b ? d.players.b[i] : 0; if (!b) return null;
    var pts = h[key] || [], res = null, inf = info(d, i);
    for (var q = 0; q < pts.length; q++) { if ((C.mondayOfWeek(pts[q].t) - (693596 + b)) / 365.25 <= N) res = pts[q]; else break; }
    if (!res || !pts.length) return null;
    var endT = inf.active ? NOW_WEEK : pts[pts.length - 1].t;
    if ((C.mondayOfWeek(endT) - (693596 + b)) / 365.25 < N) return null;
    return res;
  }
  function cmpHash() {
    var c = S.cmp.filter(function (x) { return x != null; });
    return 'compare' + (c.length ? '-' + S.sex + '-' + c.join('-') : '');
  }
  function cmpSearch(slot, q) {
    var box = $('#cres' + slot); if (!box) return;
    q = q.trim(); if (!q) { box.hidden = true; return; }
    if (!buildSearch(S.sex)) { box.hidden = false; box.innerHTML = '<div class="empty">Loading player list…</div>'; ensureSex(S.sex).then(function () { cmpSearch(slot, q); }); return; }
    var d = D[S.sex], res = search(q).filter(function (r) { return r.sex === S.sex && r.i !== S.cmp[1 - slot]; }).slice(0, 8);
    box.hidden = false;
    box.innerHTML = res.length ? res.map(function (r) {
      var g = info(d, r.i).sys[0];
      return '<button type="button" data-pick="' + slot + '" data-i="' + r.i + '"><span class="n">' + esc(playerName(d, r.i)) + ' <small>' + cflag(d, r.i) + '</small></span><span class="r">' + (g ? Math.round(g.r) : (d.players.r[r.i] || '–')) + '</span></button>';
    }).join('') : '<div class="empty">No player found.</div>';
  }

  /* ---------------- routing and events ---------------- */
  function tabs() {
    var cur = S.view === 'player' ? 'rank' : S.view;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs [data-tab]'), function (b) { b.setAttribute('aria-selected', b.dataset.tab === cur); });
  }
  function render() {
    seg(); tabs();
    if (S.view === 'player') renderPlayer();
    else if (S.view === 'week') renderWeek();
    else if (S.view === 'past') renderPast();
    else if (S.view === 'compare') renderCompare();
    else renderRank();
  }
  function route() {
    var h = location.hash.replace(/^#/, ''), m = /^p-([MW])-(\d+)$/.exec(h);
    S.more = 0;
    if (m) {
      S.view = 'player'; S.sex = m[1]; S.pid = +m[2];
      ensureSex(S.sex).then(render); render(); window.scrollTo(0, 0);
    } else if ((m = /^compare(?:-([MW])-(\d+)(?:-(\d+))?)?$/.exec(h))) {
      S.view = 'compare'; if (m[1]) S.sex = m[1]; S.cmp = m[1] ? [+m[2], m[3] != null ? +m[3] : null] : [null, null];
      var rdy = D[S.sex] && D[S.sex].ready; render(); if (!rdy) ensureSex(S.sex).then(render); window.scrollTo(0, 0);
    } else {
      S.view = h === 'week' || h === 'past' ? h : 'rank';
      ensureSex(S.sex).then(function () { render(); }); render();
      if (S.view !== 'rank') window.scrollTo(0, 0);
    }
  }
  function go(hash) { if (location.hash === '#' + hash) route(); else location.hash = hash; }
  function setSex(sex) {
    if (S.sex === sex && S.view !== 'player') return;
    S.sex = sex; S.week = null; S.pweek = null; S.more = 0; S.cty = '';
    if (S.view === 'compare') { S.cmp = [null, null]; go('compare'); return; }
    if (S.view === 'player') { S.view = 'rank'; if (location.hash && location.hash !== '#rank') location.hash = 'rank'; else route(); }
    else { ensureSex(sex).then(render); render(); }
  }
  function stepWeek(dlt) {
    var d = D[S.sex], t = (S.week == null ? NOW_WEEK : S.week) + dlt;
    S.week = Math.max(d.top.w0, Math.min(NOW_WEEK, t)); if (S.week >= NOW_WEEK) S.week = null; renderRank();
  }
  function bind() {
    $('#segM').addEventListener('click', function () { setSex('M'); });
    $('#segW').addEventListener('click', function () { setSex('W'); });
    $('#q').addEventListener('input', function () { ensureSex('M'); ensureSex('W'); renderResults(); Promise.all([ensureSex('M'), ensureSex('W')]).then(renderResults); });
    $('#q').addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('#q').value = ''; renderResults(); } });
    document.addEventListener('click', function (e) {
      var t = e.target, b;
      if ((b = t.closest('#results button'))) { $('#q').value = ''; $('#results').hidden = true; S.sex = b.dataset.sex; go('p-' + b.dataset.sex + '-' + b.dataset.i); return; }
      if (!t.closest('.search')) $('#results').hidden = true;
      if ((b = t.closest('.row'))) { go('p-' + S.sex + '-' + b.dataset.i); return; }
      if ((b = t.closest('[data-pl]'))) { go('p-' + S.sex + '-' + b.dataset.pl); return; }
      if ((b = t.closest('#tabs [data-tab]'))) { go(b.dataset.tab); return; }
      if (t.closest('#moreUp')) { S.more = 1; render(); return; }
      if ((b = t.closest('[data-tier]'))) { S.tier = +b.dataset.tier; S.more = 0; renderPast(); return; }
      if (t.closest('#pwPrev') || t.closest('#pwNext')) {
        var dd = D[S.sex], cw = S.pweek == null ? NOW_WEEK : S.pweek, nw = cw + (t.closest('#pwNext') ? 1 : -1);
        S.pweek = Math.max(dd.liveStart, Math.min(NOW_WEEK, nw)); S.more = 0; renderPast(); return;
      }
      if ((b = t.closest('[data-pick]'))) { S.cmp[+b.dataset.pick] = +b.dataset.i; go(cmpHash()); return; }
      if ((b = t.closest('[data-clear]'))) { var cn = +b.dataset.clear; S.cmp[cn] = null; if (S.cmp[0] == null && S.cmp[1] != null) S.cmp = [S.cmp[1], null]; go(cmpHash()); return; }
      if ((b = t.closest('[data-csys]'))) { cmpState.sys = b.dataset.csys; if (S.cmpH) { drawCompare(D[S.sex], S.cmp[0], S.cmp[1], S.cmpH[0], S.cmpH[1]); } return; }
      if ((b = t.closest('[data-caxis]'))) { cmpState.axis = b.dataset.caxis; if (S.cmpH) { drawCompare(D[S.sex], S.cmp[0], S.cmp[1], S.cmpH[0], S.cmpH[1]); } return; }
      if ((b = t.closest('[data-ccap]'))) { cmpState.cap = b.dataset.ccap; if (S.cmpH) { drawCompare(D[S.sex], S.cmp[0], S.cmp[1], S.cmpH[0], S.cmpH[1]); } return; }
      if ((b = t.closest('[data-crange]'))) { cmpState.range = b.dataset.crange; if (S.cmpH) { drawCompare(D[S.sex], S.cmp[0], S.cmp[1], S.cmpH[0], S.cmpH[1]); } return; }
      if ((b = t.closest('[data-cmpfrom]'))) { S.cmp = [+b.dataset.cmpfrom, null]; go('compare-' + S.sex + '-' + b.dataset.cmpfrom); return; }
      if (!t.closest('.slot')) Array.prototype.forEach.call(document.querySelectorAll('.cres'), function (x) { x.hidden = true; });
      if ((b = t.closest('[data-sys]'))) { S.sys = +b.dataset.sys; renderRank(); return; }
      if ((b = t.closest('[data-n]'))) { S.topn = +b.dataset.n; renderRank(); return; }
      if (t.closest('#wkPrev')) return stepWeek(-1);
      if (t.closest('#wkNext')) return stepWeek(1);
      if (t.closest('#nowBtn')) { S.week = null; return renderRank(); }
      if (t.closest('#back')) { if (history.length > 1 && location.hash.indexOf('p-') === 1) history.back(); else go('rank'); return; }
      if ((b = t.closest('[data-ser]'))) { chartState.on[b.dataset.ser] = !chartState.on[b.dataset.ser]; if (S.hist) { drawPlayer(D[S.sex], S.pid, S.hist); } return; }
      if ((b = t.closest('[data-range]'))) { chartState.range = b.dataset.range; if (S.hist) drawPlayer(D[S.sex], S.pid, S.hist); return; }
    });
    document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('row')) { e.preventDefault(); e.target.click(); } });
    document.addEventListener('input', function (e) {
      if (e.target.classList && e.target.classList.contains('cq')) { cmpSearch(+e.target.dataset.slot, e.target.value); return; }
      if (e.target.id === 'wk') { var t = +e.target.value; S.week = t >= NOW_WEEK ? null : t; renderRank(); var w = $('#wk'); if (w) w.focus(); } });
    document.addEventListener('change', function (e) {
      if (e.target.id === 'cage') { cmpState.age = +e.target.value; if (S.cmpH) { drawCompare(D[S.sex], S.cmp[0], S.cmp[1], S.cmpH[0], S.cmpH[1]); } return; }
      if (e.target.id === 'cty') { S.cty = e.target.value; renderRank(); return; }
      if (e.target.id === 'pwSel') { S.pweek = +e.target.value; S.more = 0; renderPast(); return; }
      if (e.target.id === 'yr') { var d = D[S.sex], t = Math.max(d.top.w0, Math.floor(C.ordOf(e.target.value + '-01-01') / 7) + 1); S.week = t >= NOW_WEEK ? null : t; renderRank(); }
    });
    window.addEventListener('hashchange', route);
    var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (S.view === 'player' && S.hist) paintChart(S.hist); }, 120); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') ['M', 'W'].forEach(function (s) { var d = D[s]; if (d && d.ready && (!d.live.at || Date.now() - d.live.at.getTime() > REFRESH_MS)) refreshLive(d); });
    });
    setInterval(function () { ['M', 'W'].forEach(function (s) { var d = D[s]; if (d && d.ready) refreshLive(d); }); }, REFRESH_MS);
  }

  function start() {
    Promise.all([getJSON(DATA + 'meta.json'), getJSON(DATA + 'tsurf.json'), getJSON(DATA + 'winprob.json')]).then(function (r) {
      META = r[0]; TS = r[1]; COEF = r[2]; GUESS = new C.SurfaceGuesser(TS);
      renderAbout(); bind(); route();
      var first = S.sex;
      ensureSex(first).then(function (d) { render(); refreshLive(d); return ensureSex(first === 'M' ? 'W' : 'M'); }).then(function (d2) { return refreshLive(d2); });
    }).catch(function (e) { $('#main').innerHTML = '<div class="loading err">Could not load the rating data (' + esc(e.message) + ').</div>'; });
  }
  start();
})();
